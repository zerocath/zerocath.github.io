short_bio: >-
  <p>
   Hi! I'm Xi Guo, a software engineer and master's student in Electrical and Computer Engineering at the University of Washington. I'm interested in distributed ML systems, GPU computing, and high-performance ML and AI infrastructures.
  </p>
  <p>
   Before coming to UW, I spent over two years at PDD building large-scale training infrastructure for search and recommendation systems, focusing on distributed training frameworks, sparse embedding systems, and training performance optimization.
   I received my Bachelor's degree in Computer Science from Huazhong University of Science and Technology in 2023.
  </p>
  <p>
   I enjoy working at the intersection of machine learning and systems, with a particular interest in making large-scale ML workloads faster and more scalable, and I'm actively looking for 2027 summer SDE & MLE internship opportunities.

