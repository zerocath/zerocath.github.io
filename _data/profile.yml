experience:
- name: PDD Holdings (Pinduoduo & Temu)
  company_url: https://www.pddholdings.com/
  company_description: >-
    PDD Holdings (Nasdaq: PDD) is a global e-commerce platform, parent company of Pinduoduo and Temu.
  logo: /assets/images/badges/pdd.png
  location: Shanghai, China
  position: Software Engineer, Machine Learning Infrastructure
  date: Jul. 2023 - Nov. 2025
  summary:
  - Built distributed training infrastructure for large-scale recommendation models across multi-node GPU clusters.
  - Focused on PyTorch migration, sparse embedding systems, and pipeline optimizations that improved throughput and GPU utilization.
  projects:
  - name: Scalable Training for Generative Recommendation Models
    highlights:
    - Implemented training workflows for generative recommendation models (HSTU) with PyTorch and TorchRec, integrating DDP and DMP to scale billion-parameter sparse training across datasets serving 300M+ DAU and multi-task objectives (recall, CTR, and CVR).
    - Built a pipelined training execution framework that overlaps CPU-side data preprocessing, sparse embedding lookup, forward/backward computation, and parameter updates, increasing training throughput by 40%+.
    - Optimized sparse embedding communication by deduplicating feature IDs before TorchRec embedding-table lookups, reducing all-to-all traffic and improving end-to-end throughput on 32 GPUs by 25%+.
  - name: Training Framework Migration
    highlights:
    - Extended SyncReplicaOptimizer(TensorFlow v1.0) with a semi-synchronous mechanism, enabling non-blocking worker execution without blocking to improve system throughput while preserving convergence stability.
    - Implemented token-based gradient admission and staleness control on the parameter server to aggregate gradients at a fixed global batch size while filtering stale updates.
    - Improved 60%+ training throughput over native synchronous training on recommendation CVR model, reaching 85% of asynchronous efficiency with +0.3% AUC improvement.
    - Supported parameter-level update strategies via TensorFlow graph modifications to meet model-specific requirements.
  - name: Distributed Training Coordination System
    highlights:
    - Designed a coordination mechanism for multi-node startup synchronization and runtime metadata distribution.
    - Implemented leader election (Zookeeper + CAS) to assign a primary worker which handles code distribution and
      cluster metadata collection, eliminating external dependencies during job startup.
    - Coordinated worker readiness and generated distributed configurations to enable reliable cluster bring-up.
  - name: Machine Learning Platform Backend
    highlights:
    - Contributed to backend development of ML platform, supporting task submission, scheduling, and monitoring.
    - Developed RESTful APIs (Python/Java) for training jobs, resource management, and user access control.
    - Unified inconsistent API endpoints across services by implementing a proxy-based routing layer, and validated con-
      consistency by comparing proxy and direct API responses in production.

