experience:
- name: PDD Holdings
  company_url: https://investor.pddholdings.com/
  company_description: >-
    A global e-commerce platform (Nasdaq: PDD), parent company of
    <a href="https://en.pinduoduo.com/group" target="_blank" rel="noopener noreferrer"><strong>Pinduoduo</strong></a> and
    <a href="https://www.temu.com/about-temu.html" target="_blank" rel="noopener noreferrer"><strong>Temu</strong></a>.
  logo: /assets/images/badges/pdd.png
  location: Shanghai, China
  position: Software Engineer, Machine Learning Infrastructure
  date: Jul. 2023 - Nov. 2025
  summary:
  - I worked on offline training infrastructure for Pinduoduo's e-commerce search and recommendation systems, serving 800M+ users. My work focused on distributed training frameworks, sparse embedding systems, and end-to-end training performance optimization. I also collaborated closely with algorithm teams to improve training workflows and diagnose model and training-system issues in production.
  projects:
  - name: Scalable Training for Generative Recommendation Models
    highlights:
    - Implemented training workflows for generative recommendation models (HSTU) using  <strong>PyTorch and TorchRec</strong>, integrating DDP and DMP to scale billion-parameter sparse training on  <strong>300M+ DAU </strong> datasets for multi-task workflows (recall, CTR, CVR).
    - Built a <strong>pipelined training execution framework</strong> that overlaps CPU-side data preprocessing, sparse embedding lookup, forward/backward computation, and parameter updates, increasing training throughput by <strong>40%+</strong>.
    - Optimized <strong>sparse embedding communication</strong> by deduplicating feature IDs before TorchRec embedding-table lookups, reducing all-to-all traffic and improving end-to-end throughput on <strong>32 GPUs by 25%+</strong>.
  - name: Training Framework Migration
    highlights:
    - Migrated a recommendation model training pipeline from <strong>TensorFlow to PyTorch</strong> on <strong>multi-node H100 clusters</strong>.
    - Integrated a custom <strong>C++ sparse Parameter Server</strong> as a CPU backend to offload massive read-only embedding tables,
      effectively bypassing <strong>GPU memory limits</strong> for memory-intensive downstream models.
    - Rebuild the end-to-end training lifecycle including <strong>sharded checkpointing</strong>, <strong>high-throughput data prefetching</strong>,
      and cross-framework consistency checks to match existing training workflows.
    - Optimized training efficiency through data prefetching and CPU–GPU coordination, leading to <strong>30%+ higher GPU
      utilization</strong> and <strong>15% faster training</strong> compared to the legacy TensorFlow system.
  - name: Semi-Synchronous Training Mechanism
    highlights:
    - Extended <strong>SyncReplicaOptimizer (TensorFlow v1.0)</strong> with a <strong>semi-synchronous mechanism</strong>, enabling non-blocking worker execution to improve system throughput while preserving convergence stability.
    - Implemented <strong>token-based gradient admission</strong> and <strong>staleness control</strong> on the parameter server to aggregate gradients at a fixed global batch size while filtering stale updates.
    - Improved training throughput by <strong>60%+</strong> over native synchronous training on a recommendation CVR model, reaching <strong>85% of asynchronous efficiency</strong> with a <strong>+0.3% AUC improvement</strong>.
    - Supported parameter-level update strategies via <strong>TensorFlow graph modifications</strong> to meet model-specific requirements.
  - name: Distributed Training Coordination System
    highlights:
    - Designed a coordination mechanism for <strong>multi-node startup synchronization</strong> and runtime metadata distribution.
    - Implemented <strong>leader election (ZooKeeper + CAS)</strong> to assign a primary worker which handles code distribution and
      cluster metadata collection, eliminating external dependencies during job startup.
    - Coordinated worker readiness and generated <strong>distributed configurations</strong> to enable reliable cluster bring-up.
  - name: Machine Learning Platform Backend
    highlights:
    - Contributed to backend development of an <strong>ML platform</strong>, supporting task submission, scheduling, and monitoring.
    - Developed <strong>RESTful APIs (Python/Java)</strong> for training jobs, resource management, and user access control.
    - Unified inconsistent API endpoints across services by implementing a <strong>proxy-based routing layer</strong>, and validated
      consistency by comparing proxy and direct API responses in production.

